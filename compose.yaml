services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Значения берутся из .env (docker compose читает его сам).
      # Без них compose не стартует — это лучше, чем тихо поднять базу с паролем,
      # который лежит в публичном репозитории.
      POSTGRES_DB: ${DB_NAME:?DB_NAME не задан в .env}
      POSTGRES_USER: ${DB_USER:?DB_USER не задан в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env}
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    # Тома нет — для локальной разработки это нормально. Но в Redis лежат не только временные
    # счётчики (попытки входа, лимиты по IP, капча): там же реестр погашенных refresh-токенов на
    # 30 дней (authserver/RefreshTokenReuseDetector). Потеря Redis = кражу старого токена до
    # перезапуска не узнать. На сервере Redis — с сохранением на диск (appendonly) и томом.


volumes:
  auth-db-data:

