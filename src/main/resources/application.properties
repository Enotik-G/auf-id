spring.application.name=planner

# Локальные секреты из файла .env в корне проекта (он в .gitignore). optional: — если файла нет
# (на сервере), приложение берёт переменные окружения как обычно.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=auth
spring.datasource.password=${DB_PASSWORD:auf67}

spring.jpa.hibernate.ddl-auto=validate

# Cookie сессии входа. SameSite=Lax — браузер не приложит её к запросам, которые чужой сайт отправляет формой
# (вторая линия защиты от CSRF). Secure — только по HTTPS: на сервере обязательно SESSION_COOKIE_SECURE=true,
# локально false, потому что здесь http.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# DaoAuthenticationProvider собран вручную (login/LoginConfiguration — свой порядок проверок при входе),
# поэтому предупреждение Spring «UserDetailsService не будет подключён автоматически» ожидаемо.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Ошибки API — в стандартном формате RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui/index.html. Кнопка «Try it out» включена сразу.
# Выключить на сервере: SPRINGDOC_API_DOCS_ENABLED=false и SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# Перец для паролей. Умолчания нет намеренно: без переменной окружения приложение не стартует.
auth.password.pepper=${PASSWORD_PEPPER}

# Секрет, которым сервер подписывает задачки капчи (ALTCHA): без него поддельную задачку не выдать за нашу.
# Как и перец — без умолчания, локально лежит в .env. Общий для всех копий приложения.
auth.captcha.hmac-secret=${CAPTCHA_SECRET}

# Redis — счётчики попыток входа и лимиты запросов. Локально — из compose.yaml.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Сервер авторизации (выдача токенов). issuer — «кто выдал токен»: поле iss в каждом JWT,
# сервисы проверяют его. Совпадает с публичным адресом Auth.
spring.security.oauth2.authorizationserver.issuer=${AUTH_PUBLIC_URL:http://localhost:8080}

# ВРЕМЕННЫЙ клиент для разработки (шаг 3.1). В шаге 3.3 клиенты переедут в базу, этот блок уйдёт.
# Публичный клиент (без секрета) + обязательный PKCE — так входят SPA и мобильные приложения.
spring.security.oauth2.authorizationserver.client.planner-dev.registration.client-id=planner-dev
spring.security.oauth2.authorizationserver.client.planner-dev.registration.client-name=Планировщик (разработка)
spring.security.oauth2.authorizationserver.client.planner-dev.registration.client-authentication-methods=none
spring.security.oauth2.authorizationserver.client.planner-dev.registration.authorization-grant-types=authorization_code
spring.security.oauth2.authorizationserver.client.planner-dev.registration.redirect-uris=http://127.0.0.1:8090/login/oauth2/code/auth
spring.security.oauth2.authorizationserver.client.planner-dev.registration.scopes=openid,profile
spring.security.oauth2.authorizationserver.client.planner-dev.require-proof-key=true
# Свой сервис — не спрашиваем «разрешить доступ?», человек и так входит в экосистему колледжа.
spring.security.oauth2.authorizationserver.client.planner-dev.require-authorization-consent=false
# Access token живёт 10 минут (решение архитектуры: сервисы проверяют его сами, без запроса в Auth).
spring.security.oauth2.authorizationserver.client.planner-dev.token.access-token-time-to-live=10m

# Почта. Локально — Mailpit из compose.yaml (письма смотреть на http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
auth.mail.from=${MAIL_FROM:no-reply@auth.local}

# Адрес, по которому пользователи открывают Auth в браузере. Из него строятся ссылки в письмах.
auth.public-url=${AUTH_PUBLIC_URL:http://localhost:8080}
