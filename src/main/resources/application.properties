spring.application.name=auf-id

# Локальные секреты из файла .env в корне проекта (он в .gitignore). optional: — если файла нет
# (на сервере), приложение берёт переменные окружения как обычно.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
# Без умолчания намеренно: пароль задаётся только в .env, как перец и ключ подписи.
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

# ───────────────────────── За обратным прокси (nginx) ─────────────────────────
# Шаг 20. Прокси подключается к нам сам, поэтому request.getRemoteAddr() вернёт адрес прокси, а не
# человека. Настоящий адрес прокси кладёт в заголовок X-Forwarded-For. Без этих двух настроек все
# пользователи попали бы в одно ведро лимитов (ratelimit/RateLimitFilter): утром двадцать первый
# студент получил бы отказ, потому что до него девятнадцать других «израсходовали» лимит прокси.
#
# native — заголовки разбирает сам Tomcat (RemoteIpValve), подменяя getRemoteAddr(). Код фильтра
# лимитов при этом не меняется: он как раньше спрашивает адрес у запроса.
#
# Умолчание none (выключено) намеренно: локально прокси нет, а доверять заголовку без прокси нельзя —
# его прислал бы сам клиент. На сервере: FORWARD_HEADERS_STRATEGY=native.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# От кого Tomcat вообще принимает X-Forwarded-For. Если подключившийся не попал в этот список,
# заголовок игнорируется целиком — иначе любой желающий подделал бы свой адрес и обошёл лимиты,
# прислав X-Forwarded-For со случайным значением на каждый запрос.
#
# Формат — список сетей через запятую (CIDR): 10.0.0.5/32 — один адрес, 10.0.0.0/24 — подсеть.
#
# Умолчание Tomcat — ВСЕ частные сети (10/8, 172.16/12, 192.168/16, 100.64/10, 127/8, fc00::/7 и
# т.п.). В Docker или Kubernetes это значит «любой контейнер в сети», что слишком широко. Поэтому
# здесь сужено до loopback, а на сервере указывать адрес своего прокси:
# TRUSTED_PROXIES=10.0.0.5/32
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:127.0.0.1/32}

# Cookie сессии входа. SameSite=Lax — браузер не приложит её к запросам, которые чужой сайт отправляет формой
# (вторая линия защиты от CSRF). Secure — только по HTTPS: на сервере обязательно SESSION_COOKIE_SECURE=true,
# локально false, потому что здесь http.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# DaoAuthenticationProvider собран вручную (login/LoginConfiguration — свой порядок проверок при входе),
# поэтому предупреждение Spring «UserDetailsService не будет подключён автоматически» ожидаемо.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Ошибки API — в стандартном формате RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui/index.html. Кнопка «Try it out» включена сразу.
# Выключить на сервере: SPRINGDOC_API_DOCS_ENABLED=false и SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc.swagger-ui.try-it-out-enabled=true
# Админка защищена от CSRF: Swagger UI сам берёт токен из cookie XSRF-TOKEN и отправляет его
# заголовком X-XSRF-TOKEN (см. SecurityConfiguration). Без этого любой POST из Swagger получал бы 403.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method

# Перец для паролей. Умолчания нет намеренно: без переменной окружения приложение не стартует.
auth.password.pepper=${PASSWORD_PEPPER}

# Секрет, которым сервер подписывает задачки капчи (ALTCHA): без него поддельную задачку не выдать за нашу.
# Как и перец — без умолчания, локально лежит в .env. Общий для всех копий приложения.
auth.captcha.hmac-secret=${CAPTCHA_SECRET}

# Redis — счётчики попыток входа и лимиты запросов. Локально — из compose.yaml.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Сервер авторизации (выдача токенов). issuer — «кто выдал токен»: поле iss в каждом JWT,
# сервисы проверяют его. Совпадает с публичным адресом Auth.
spring.security.oauth2.authorizationserver.issuer=${AUTH_PUBLIC_URL:http://localhost:8080}

# Сайты (origin: схема://домен:порт), которым браузер разрешит читать ответы /oauth2/token, /userinfo,
# /oauth2/jwks и т.п. из JavaScript — SPA сервисов экосистемы. Через запятую, «*» запрещён.
# Пусто — CORS выключен.
auth.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:}

# Закрытый ключ подписи токенов: ES256 (кривая P-256), PKCS#8 в base64. Без умолчания — как перец.
# Постоянный: после перезапуска и на всех копиях приложения токены подписываются одним ключом.
auth.jwt.signing-key=${JWT_SIGNING_KEY}

# Первые администраторы: роль ADMIN выдаётся им при входе, потому что выдать её через
# админку некому, пока нет ни одного администратора. Список через запятую, пустой —
# механизм отключён. Запись сюда никогда не отнимает роль.
auth.bootstrap.admin-emails=${BOOTSTRAP_ADMIN_EMAILS:}

# Лимиты запросов с одного IP в минуту (ratelimit/RateLimit). Колледж, скорее всего, выходит в
# интернет через общий NAT — тогда все студенты делят одно ведро, поэтому числа большие. От подбора
# пароля защищает капча после трёх неудач по почте, а не этот лимит. Уточнять по логам на сервере.
auth.rate-limit.login-per-minute=${AUTH_LOGIN_RATE_LIMIT:300}
auth.rate-limit.token-per-minute=${AUTH_TOKEN_RATE_LIMIT:600}

# Почты каких доменов вообще допускаются (решение 2026-10-10): только адреса колледжа. Админ не
# создаст учётку с чужим адресом, а войти с ней нельзя, даже если она как-то оказалась в базе.
# Список через запятую, совпадение точное: поддомены (student.sinhub.ru) нужно перечислять отдельно.
auth.allowed-email-domains=${AUTH_ALLOWED_EMAIL_DOMAINS:sinhub.ru}

# Клиенты сервера авторизации хранятся в БД (миграция 005). Клиенты launcher-dev и planner-dev
# для разработки (authserver/DevClientRegistration) регистрируются при запуске, только если явно
# включены — локально в .env, на сервере по умолчанию выключены.
auth.dev-client.enabled=${AUTH_DEV_CLIENT_ENABLED:false}

# Как часто удалять авторизации, в которых истекли все коды и токены (authserver/ExpiredAuthorizationCleanupJob).
# Формат ISO-8601: PT1H — час, PT15M — 15 минут. На все копии приложения очистка идёт одна (ключ в Redis).
auth.authorization-cleanup.interval=${AUTH_AUTHORIZATION_CLEANUP_INTERVAL:PT1H}


# Адрес, по которому пользователи открывают Auth в браузере. Из него строятся ссылки активации,
# которые админка отдаёт администратору.
auth.public-url=${AUTH_PUBLIC_URL:http://localhost:8080}
