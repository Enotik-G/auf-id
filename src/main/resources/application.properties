spring.application.name=planner

# Локальные секреты из файла .env в корне проекта (он в .gitignore). optional: — если файла нет
# (на сервере), приложение берёт переменные окружения как обычно.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=auth
spring.datasource.password=${DB_PASSWORD:auf67}

spring.jpa.hibernate.ddl-auto=validate

# Cookie сессии входа. SameSite=Lax — браузер не приложит её к запросам, которые чужой сайт отправляет формой
# (вторая линия защиты от CSRF). Secure — только по HTTPS: на сервере обязательно SESSION_COOKIE_SECURE=true,
# локально false, потому что здесь http.
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# DaoAuthenticationProvider собран вручную (login/LoginConfiguration — свой порядок проверок при входе),
# поэтому предупреждение Spring «UserDetailsService не будет подключён автоматически» ожидаемо.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Ошибки API — в стандартном формате RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui/index.html. Кнопка «Try it out» включена сразу.
# Выключить на сервере: SPRINGDOC_API_DOCS_ENABLED=false и SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method

# Перец для паролей. Умолчания нет намеренно: без переменной окружения приложение не стартует.
auth.password.pepper=${PASSWORD_PEPPER}

# Redis — счётчики попыток входа и лимиты запросов. Локально — из compose.yaml.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Почта. Локально — Mailpit из compose.yaml (письма смотреть на http://localhost:8025).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
auth.mail.from=${MAIL_FROM:no-reply@auth.local}

# Адрес, по которому пользователи открывают Auth в браузере. Из него строятся ссылки в письмах.
auth.public-url=${AUTH_PUBLIC_URL:http://localhost:8080}
