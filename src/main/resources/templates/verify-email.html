<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Токен в адресе страницы: не передаём его другим сайтам и не пускаем страницу в поисковики. -->
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Подтверждение почты</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="card">

    <div th:if="${state == 'confirm'}">
        <h1>Подтвердите почту</h1>
        <p>Нажмите кнопку, чтобы завершить регистрацию.</p>
        <form method="post" th:action="@{/verify-email}">
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit">Подтвердить почту</button>
        </form>
    </div>

    <div th:if="${state == 'success'}">
        <h1>Почта подтверждена</h1>
        <p>Регистрация завершена — теперь можно войти.</p>
    </div>

    <div th:if="${state == 'invalid'}">
        <h1>Ссылка недействительна</h1>
        <p>Ссылка устарела или уже была использована. Если почта ещё не подтверждена,
            зарегистрируйтесь заново — придёт новое письмо.</p>
    </div>

</main>
</body>
</html>
