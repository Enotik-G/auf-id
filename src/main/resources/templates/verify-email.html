<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Токен в адресе страницы: не передаём его другим сайтам и не пускаем страницу в поисковики. -->
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>Подтверждение почты</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 16px;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #1f2328;
        }
        .card {
            max-width: 420px;
            width: 100%;
            padding: 32px;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 1px 3px rgb(0 0 0 / 0.08);
        }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { margin: 0 0 20px; line-height: 1.5; color: #57606a; }
        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #1f6feb;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1a5fd0; }
    </style>
</head>
<body>
<main class="card">

    <div th:if="${state == 'confirm'}">
        <h1>Подтвердите почту</h1>
        <p>Нажмите кнопку, чтобы завершить регистрацию.</p>
        <form method="post" th:action="@{/verify-email}">
            <input type="hidden" name="token" th:value="${token}">
            <button type="submit">Подтвердить почту</button>
        </form>
    </div>

    <div th:if="${state == 'success'}">
        <h1>Почта подтверждена</h1>
        <p>Регистрация завершена — теперь можно войти.</p>
    </div>

    <div th:if="${state == 'invalid'}">
        <h1>Ссылка недействительна</h1>
        <p>Ссылка устарела или уже была использована. Если почта ещё не подтверждена,
            зарегистрируйтесь заново — придёт новое письмо.</p>
    </div>

</main>
</body>
</html>
