# Настройки только для тестов. Spring Boot читает config/application.properties поверх основного
# application.properties — так тестам не нужны .env и переменные окружения.
# Значения тестовые и нигде больше не используются.
auth.password.pepper=test-pepper-only-for-tests-0123456789
auth.captcha.hmac-secret=test-captcha-secret-only-for-tests-0123
# Ключ подписи JWT (ES256) — ТОЛЬКО для тестов, нигде больше не используется.
auth.jwt.signing-key=MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgpg0iUJJhsypeYdHz2zQi07U1MzATGAO14rDDlCqZvBOhRANCAAR6SKugoFWIsxsq2upeO9pM9EiBwh01F/Ejth+DCX7an3v1At2cSBnXG+QK36QZ2VAy7AXq0cMue6cGHDjOXiLJ
auth.dev-client.enabled=true
# Разрешённый для CORS сайт — проверяется в AuthorizationServerTest.
auth.cors.allowed-origins=http://planner.test

# Testcontainers подменяет подключение целиком (@ServiceConnection), но плейсхолдеры
# из основного application.properties всё равно должны чем-то разрешиться.
spring.datasource.url=jdbc:postgresql://localhost:5432/unused-in-tests
spring.datasource.username=unused-in-tests
spring.datasource.password=unused-in-tests

# Лимит входов по IP — как был до 2026-10-10 (на сервере 300): тесты лимита доходят до него
# настоящими входами через Argon2, и 300 таких входов заметно замедлили бы сборку.
auth.rate-limit.login-per-minute=20
